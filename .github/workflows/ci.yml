name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflows only need to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # prisma.config.ts requires this at generate time; no real DB is used in CI
      # (tests mock Prisma).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx next typegen

      # Fails the build on critical vulnerabilities in production dependencies.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # The `secrets` context is not available in a job-level `if`, so the presence of the
  # Liveblocks key is detected in a step and exposed as a job output instead.
  secrets-check:
    runs-on: ubuntu-latest
    outputs:
      has-liveblocks: ${{ steps.check.outputs.has-liveblocks }}
    steps:
      - id: check
        env:
          LIVEBLOCKS_SECRET_KEY: ${{ secrets.LIVEBLOCKS_SECRET_KEY }}
        run: echo "has-liveblocks=$([ -n "$LIVEBLOCKS_SECRET_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  e2e:
    needs: secrets-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skips cleanly (shown as "skipped", not failed) when the Liveblocks secret isn't set -
    # e.g. on a fork, or before the repo owner has added a Liveblocks project's key.
    # See e2e/README.md for what this test suite needs and why.
    if: needs.secrets-check.outputs.has-liveblocks == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U e2e -d e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/e2e
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      LIVEBLOCKS_SECRET_KEY: ${{ secrets.LIVEBLOCKS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
